<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Vinted Manager Sync</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <div class="header">
            <div class="logo">V</div>
            <div>
                <h2>Vinted Manager</h2>
                <p class="subtitle">Extension de Synchronisation</p>
            </div>
        </div>

        <div class="section">
            <label for="serverUrl">URL du Serveur API</label>
            <input type="text" id="serverUrl" value="https://vintedmanager-bkgg.vercel.app" placeholder="https://vintedmanager-bkgg.vercel.app" />
        </div>

        <div class="section">
            <label for="pseudoOverride">Pseudo Vinted</label>
            <input type="text" id="pseudoOverride" placeholder="ex: julia_rent" />
        </div>

        <div class="metrics-grid">
            <div class="metric">
                <span className="metric-label">👀 Vues</span>
                <span className="metric-val" id="valVues">0</span>
            </div>
            <div className="metric">
                <span className="metric-label">❤️ Likes</span>
                <span className="metric-val" id="valLikes">0</span>
            </div>
            <div className="metric">
                <span className="metric-label">💬 Msgs</span>
                <span className="metric-val" id="valMsgs">0</span>
            </div>
            <div className="metric">
                <span className="metric-label">💰 Ventes</span>
                <span className="metric-val" id="valVentes">0</span>
            </div>
            <div className="metric">
                <span className="metric-label">🟢 Actifs</span>
                <span className="metric-val" id="valActifs">0</span>
            </div>
            <div className="metric">
                <span className="metric-label">🟠 Brouillons</span>
                <span className="metric-val" id="valBrouillons">0</span>
            </div>
            <div className="metric">
                <span className="metric-label">🙈 Masqués</span>
                <span className="metric-val" id="valMasques">0</span>
            </div>
            <div className="metric">
                <span className="metric-label">📦 Articles</span>
                <span className="metric-val" id="valItems">0</span>
            </div>
        </div>

        <button id="btnSync" className="btn-sync">
            ⚡ Scraper & Synchroniser Tout
        </button>

        <div id="statusMsg" className="status-msg"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
