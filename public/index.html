<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord · Vinted Manager</title>
    <meta name="description" content="Application complète Vinted Manager propulsée par React 18 et backend Node.js / Supabase Cloud.">
    <meta name="theme-color" content="#0F766E">

    <!-- Favicon & PWA Manifest -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Open Graph & Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Vinted Manager">
    <meta property="og:description" content="Gestion multi-comptes, automatisation, tâches et suivi des performances Vinted.">
    <meta property="og:image" content="/og-image-1200x630.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Vinted Manager">
    <meta name="twitter:description" content="Gestion multi-comptes, automatisation, tâches et suivi des performances Vinted.">
    <meta name="twitter:image" content="/og-image-1200x630.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- React 18 Local (Zero Dépendance CDN) -->
    <script src="js/vendor/react.production.min.js"></script>
    <script src="js/vendor/react-dom.production.min.js"></script>
</head>

<body>

    <!-- POINT DE MONTAGE REACT AVEC CHARGEMENT INITIAL LOGO & ANIMATION CYCLIQUE -->
    <div id="root">
        <div class="app-loading-overlay">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <div class="circular-loader-container" style="width: 84px; height: 84px;">
                    <div class="circular-loader-ring-outer" style="inset: -28px; border-width: 1.5px;"></div>
                    <div class="circular-loader-ring" style="inset: -18px; border-width: 4px;"></div>
                    <div class="circular-loader-icon">
                        <img src="/assets/icone/icone-256.png" alt="Vinted Manager Logo" width="58" height="58" style="object-fit: contain; border-radius: 14px; display: block;" />
                    </div>
                </div>
                <div style="font-size: 15px; font-weight: 700; color: #0f172a; margin-top: 22px; letter-spacing: -0.3px; text-align: center;">
                    Chargement de Vinted Manager...
                </div>
                <div style="font-size: 12.5px; color: #64748b; font-weight: 500; text-align: center; margin-top: 3px;">
                    Initialisation de l'application & des données
                </div>
                <div class="loading-progress-bar-indeterminate">
                    <div class="loading-progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT BUNDLE REACT PRÉ-COMPILÉ (CHARGEMENT INSTANTANÉ SANS ÉCRAN BLANC) -->
    <script src="js/api.js?v=2.3.0"></script>
    <script src="js/bundle.js?v=2.3.0"></script>
</body>

</html>
